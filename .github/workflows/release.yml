name: Ubuntu desktop release
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      source_commit:
        type: string
        default: ''
      source_version:
        type: string
        default: ''
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package as the current update
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ubuntu-desktop-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DSH_GATE_CONCURRENCY: '1'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install publication policy dependencies and test release rules
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Install build and desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-yaml libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libnotify4 libsecret-1-0 libxtst6 libxss1 zenity xvfb
          corepack enable
      - name: Select an official source candidate when called by upstream synchronization
        env:
          CANDIDATE_SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          commit = os.environ.get('CANDIDATE_SOURCE_COMMIT', '')
          version = os.environ.get('CANDIDATE_SOURCE_VERSION', '')
          if commit or version:
              if not re.fullmatch(r'[a-f0-9]{40}', commit) or not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version):
                  raise SystemExit('Invalid official source candidate')
              path = pathlib.Path('upstream.json')
              current = json.loads(path.read_text())
              current.update(commit=commit, productVersion=version)
              path.write_text(json.dumps(current, indent=2) + '\n')
          PYTHON
      - name: Select an increasing build version and update URL
        run: |
          node release-policy.mjs version
          echo "DSH_DESKTOP_LINUX_UPDATE_URL=https://github.com/$GITHUB_REPOSITORY/releases/latest/download/" >> "$GITHUB_ENV"
      - name: Build and verify the independent Ubuntu package
        run: ./build.sh
      - name: Qualify the real updater with an application-specific sandbox profile
        run: |
          source_dir=$(cat dist/source-directory.txt)
          electron_path="$source_dir/apps/desktop/.desktop-build/targets/linux-x64/electron/electron"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile dsh-ubuntu-ci "%s" flags=(unconfined) {\n  userns,\n}\n' "$electron_path" | sudo tee /etc/apparmor.d/dsh-ubuntu-ci >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/dsh-ubuntu-ci
          cd "$source_dir"
          xvfb-run -a corepack pnpm run test:updates:linux
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ubuntu-desktop-${{ env.DSH_DESKTOP_BUILD_VERSION }}
          path: |
            dist/*.deb
            dist/*-linux.yml
            dist/SHA256SUMS
            dist/upstream.json
      - name: Publish the explicit stable-channel release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node release-policy.mjs check
          gh release create "ubuntu-v$DSH_DESKTOP_BUILD_VERSION" \
            --title "Ubuntu desktop $DSH_DESKTOP_BUILD_VERSION" \
            --notes-file release-notes.md \
            --latest \
            dist/*.deb dist/*-linux.yml dist/SHA256SUMS dist/upstream.json
